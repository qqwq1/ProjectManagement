services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: project_management
      POSTGRES_USER: naujava
      POSTGRES_PASSWORD: ${DB_PASSWORD:-naujava}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naujava -d project_management"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
