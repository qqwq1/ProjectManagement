spring.application.name=NauJava
app.console.enabled=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/project_management}
spring.datasource.username=${DB_USERNAME:naujava}
spring.datasource.password=${DB_PASSWORD:naujava}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# REST repositories are separated from HTML and custom controllers.
spring.data.rest.base-path=/api
spring.jpa.open-in-view=false
